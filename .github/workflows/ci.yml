# CI/CD for the backend.
#
#   pull request / any push   verify (build, typecheck, lint, format, tests) and security (Trivy + OpenGrep)
#   push to main              + image: build and push ghcr.io/<owner>/<repo>:<commit> (and :latest)
#                             + deploy: run that image (pinned by digest) on the VPS over SSH
#
# Deploy is skipped until the repository has the variables VPS_HOST and VPS_USER and the secrets VPS_SSH_KEY and
# VPS_KNOWN_HOSTS (see docs/deployment.md). It runs in the "production" environment, so protection rules such as
# required reviewers can be added there.
name: ci-cd
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs that publish or deploy ask for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to full commit SHAs (immutable); the release tag is noted for upgrades.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r test

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy and OpenGrep (pinned, checksum-verified)
        run: |
          bash scripts/install-scanners.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the reviewers' commands (fails on any Trivy finding or OpenGrep ERROR/WARNING)
        run: bash scripts/scan.sh "$RUNNER_TEMP/scan"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-reports
          path: |
            ${{ runner.temp }}/scan/export/trivy-results.json
            ${{ runner.temp }}/scan/export/opengrep-results.json
          if-no-files-found: ignore

  image:
    needs: [verify, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push the image
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$repo:$GITHUB_SHA" -t "$repo:latest" .
          docker push --quiet "$repo:$GITHUB_SHA"
          docker push --quiet "$repo:latest"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  deploy:
    needs: image
    if: vars.VPS_HOST != '' && vars.VPS_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PLAYGROUND_URL }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to the VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          SSH_KEY_FILE="$RUNNER_TEMP/deploy_key" KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts" bash scripts/deploy.sh
          rm -f "$RUNNER_TEMP/deploy_key"
