packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency install scripts unless allowed. esbuild's only checks its platform binary.
allowBuilds:
  # @scarf/scarf (pulled in by swagger-ui-dist) only sends install telemetry: blocked.
  '@scarf/scarf': false
  esbuild: true

# Supply-chain hardening.
# Only install package versions that have been public for at least 7 days.
minimumReleaseAge: 10080
# Transitive dependencies may only come from the registry (no git or tarball URLs).
blockExoticSubdeps: true
# Refuse updates that downgrade a package's publishing trust (e.g. provenance to none).
trustPolicy: no-downgrade

# Security fixes published less than 7 days ago, allowed by exact version (remove once they are a week old):
#   body-parser 2.4.0  GHSA-27r3-jxmh-p828, DoS via trailing bytes after a compressed request body
#   multer 2.5.0       DoS via a pending asynchronous fileFilter after request teardown
minimumReleaseAgeExclude:
  - body-parser@2.4.0
  - multer@2.5.0
overrides:
  body-parser: 2.4.0
  multer: 2.5.0
